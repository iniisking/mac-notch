name: Notch
options:
  bundleIdPrefix: com.theajstars
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    # Xcode-IDE builds are ad-hoc signed; scripts/build.sh re-signs with your
    # Apple Development identity so Full Disk Access survives rebuilds.
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  Notch:
    type: application
    platform: macOS
    sources:
      - path: Sources/Notch
      - path: Sources/Shared
    info:
      path: Config/Notch-Info.plist
      properties:
        CFBundleName: Notch
        CFBundleDisplayName: Notch
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Personal use."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.theajstars.notch
        PRODUCT_NAME: Notch
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
  notch-dbcheck:
    type: tool
    platform: macOS
    sources:
      - path: Sources/notch-dbcheck
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.theajstars.notch.dbcheck
        PRODUCT_NAME: notch-dbcheck
