name: Notch
options:
  bundleIdPrefix: com.theajstars
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    # Xcode-IDE builds are ad-hoc signed; scripts/build.sh re-signs with your
    # Apple Development identity so Full Disk Access survives rebuilds.
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  Notch:
    type: application
    platform: macOS
    sources:
      - path: Sources/Notch
      - path: Sources/Shared
      - path: Sources/NotchMedia/notch-media.pl
        buildPhase: resources
    dependencies:
      # Embedded but NOT linked: /usr/bin/perl loads it at runtime (see Sources/NotchMedia).
      - target: NotchMedia
        embed: true
        link: false
    entitlements:
      path: Config/Notch.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        # Hardened runtime: EventKit (Up next) needs this to read calendars.
        com.apple.security.personal-information.calendars: true
    info:
      path: Config/Notch-Info.plist
      properties:
        CFBundleName: Notch
        CFBundleDisplayName: Notch
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Personal use."
        NSAppleEventsUsageDescription: "Notch reads your browser's tab addresses to tell YouTube from YouTube Music, sends your Messages replies, and runs launcher commands (dark mode, empty Trash, eject disks)."
        NSBluetoothAlwaysUsageDescription: "Notch shows your AirPods and headphones, with battery levels, when they connect."
        NSCalendarsFullAccessUsageDescription: "Notch shows your next event and a Join button for meetings."
        NSCalendarsUsageDescription: "Notch shows your next event and a Join button for meetings."
        NSRemindersFullAccessUsageDescription: "The launcher adds reminders you type (\"remind call mum tomorrow 6pm\")."
        NSRemindersUsageDescription: "The launcher adds reminders you type (\"remind call mum tomorrow 6pm\")."
        NSLocalNetworkUsageDescription: "Notch receives battery and status updates from your iPhone's Shortcuts over the local network."
        NSBonjourServices: ["_notch._tcp"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.theajstars.notch
        PRODUCT_NAME: Notch
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
  notch-dbcheck:
    type: tool
    platform: macOS
    sources:
      - path: Sources/notch-dbcheck
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.theajstars.notch.dbcheck
        PRODUCT_NAME: notch-dbcheck
  NotchMedia:
    type: library.dynamic
    platform: macOS
    sources:
      - path: Sources/NotchMedia
        excludes: ["*.pl"]
    dependencies:
      - sdk: Foundation.framework
    settings:
      base:
        PRODUCT_NAME: NotchMedia
        EXECUTABLE_PREFIX: lib
        CLANG_ENABLE_OBJC_ARC: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        SKIP_INSTALL: YES
